name: Build Haseeb Gaming APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish debug APK as a GitHub pre-release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'build-error.txt'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK 27, and CMake 3.22.1
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/Android/Sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q -o /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -f /tmp/cmdline-tools.zip
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Generate debug.keystore
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify gradle.properties
        run: |
          set -euo pipefail
          grep -q '^android.useAndroidX=true$' gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties
          grep -q '^org.gradle.configuration-cache=false$' gradle.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build Debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haseeb-gaming-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK Pre-Release (when requested)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-ci-${{ github.run_number }}
          name: Haseeb Gaming APK #${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
