name: Build HASEEB GAMING v2
on: workflow_dispatch
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply fixes
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py 2>&1 | tee -a /tmp/all.log

      - name: Android SDK + NDK + CMake
        run: |
          set +e
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip >> /tmp/all.log 2>&1
          unzip -q clt.zip -d cmdline-tools >> /tmp/all.log 2>&1
          mv cmdline-tools/cmdline-tools cmdline-tools/latest 2>> /tmp/all.log
          yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" >> /tmp/all.log 2>&1
          echo "SDK_INSTALL=$?" >> /tmp/all.log
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          cd "$GITHUB_WORKSPACE"
          echo "sdk.dir=$SDK" > local.properties

      - name: Gradle (installed outside the repo)
        run: |
          set +e
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip >> /tmp/all.log 2>&1
          echo "GRADLE_DL=$?" >> /tmp/all.log
          unzip -q /tmp/gradle.zip -d /opt >> /tmp/all.log 2>&1
          echo "GRADLE_UNZIP=$?" >> /tmp/all.log
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          set +e
          gradle --no-daemon assembleDebug > /tmp/build.log 2>&1
          echo "GRADLE_BUILD=$?" >> /tmp/all.log
          grep -nE "(^|: )e: |error:|FAILURE:|What went wrong|CMake Error|undefined reference" /tmp/build.log | grep -v "note:" | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null

      - name: Report
        if: always()
        run: |
          set +e
          ERR=$(grep -m3 -E "(^|: )e: |error:|FAILURE:|What went wrong|CMake Error|undefined reference|GRADLE_BUILD|SDK_INSTALL" /tmp/all.log /tmp/build.log 2>/dev/null | grep -v "note:" | head -3 | tr '\n' ' ' | cut -c1-170)
          [ -z "$ERR" ] && ERR="build-ok-or-no-error-line"
          cp /tmp/all.log ci.log 2>/dev/null; cp /tmp/build.log build-full.log 2>/dev/null
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci.log build-full.log app/build.gradle.kts gradle/libs.versions.toml build.gradle.kts app/src/main/cpp/CMakeLists.txt .gitignore 2>/dev/null
          git add -A 2>/dev/null
          git commit -m "CI: $ERR" 2>&1 | head -3
          git pull --rebase --autostash 2>&1 | head -3
          git push 2>&1 | head -5

      - name: Publish APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: HASEEB GAMING ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
