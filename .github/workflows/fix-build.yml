name: Build HASEEB GAMING v2

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish debug APK as a GitHub pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      create_release: ${{ inputs.create_release }}
    secrets: inherit
